aid: dforce
name: dForce
description: 'dForce is a decentralized stablecoin protocol powered by an integrated DeFi matrix spanning
  assets, lending, trading, and an omni-chain bridge. It positions itself as an AI-native on-chain capital
  markets platform, unifying its USX USD-pegged stablecoin, permissionless lending markets, yield vaults,
  a real-world-asset (RWA) marketplace, a DEX, the InteNet launchpad, and DF-native cross-chain bridging
  under DAO governance driven by the DF token. dForce ships as smart contracts across multiple EVM chains
  rather than a hosted REST API; its developer surface is on-chain contracts, open documentation, and the
  dforce-network GitHub organization. Backed by Multicoin Capital.'
